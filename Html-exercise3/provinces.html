<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South African Provinces Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
          border: 1px solid black;
          padding: 8px;
          text-align: left;
        }
        th{
          background-color: #f2f2f2;
          font-weight: bold;
        }
    </style>
  </head>
  <body>
    <table>
      <thread>
        <tr>
          <th>Rank</th>
          <th>Province</th>
          <th>Population (2011)</th>
          <th>Area (km2)</th>
          <th>Density (per km2)</th>
        </tr>
      </thread>
      <tbody>
        <tr>
          <td>1</td>
          <td>Gauteng</td>
          <td>12,272,263</td>
          <td>18,178</td>
          <td>675.1</td>
        </tr>
        <tr>
            <td>2</td>
            <td>KwaZulu-Natal</td>
            <td>10,267,300</td>
            <td>120,361</td>
            <td>85.3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Limpopo</td>
            <td>5,404,688</td>
            <td>125,755</td>
            <td>43.0</td>
      </tr>
      </tbody>
    </table>

</body>
</html>
